  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

orant Garamond', Georgia, serif;font-style:italic;font-size:17px;line-height:1.35;color:#6B6660;max-width:300px;text-wrap:pretty;\">Le rouge des baies, le vert des feuilles, la profondeur d'un produit confit.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-cascade=\"1\" style=\"width:86%;height:1px;background:#E5DFD4;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <div data-cascade=\"1\" style=\"font-family:'Cormorant Garamond', Georgia, serif;font-weight:600;font-size:12.5px;letter-spacing:.36em;color:#3A3733;padding-left:.36em;\">PLAT<\u002Fdiv>\n        <div data-cascade=\"1\" style=\"font-family:'Poppins', sans-serif;font-weight:600;font-size:15px;line-height:1.38;color:#1F1D1B;text-wrap:balance;\">La mémoire du feu, velours brun<\u002Fdiv>\n        <div data-cascade=\"1\" style=\"font-family:'Cormorant Garamond', Georgia, serif;font-style:italic;font-size:17px;line-height:1.35;color:#6B6660;max-width:300px;text-wrap:pretty;\">Le temps, la tendreté et les sucs d'une cuisson patiente.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-cascade=\"1\" style=\"width:86%;height:1px;background:#E5DFD4;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <div data-cascade=\"1\" style=\"font-family:'Cormorant Garamond', Georgia, serif;font-weight:600;font-size:12.5px;letter-spacing:.36em;color:#3A3733;padding-left:.36em;\">DESSERT<\u002Fdiv>\n        <div data-cascade=\"1\" style=\"font-family:'Poppins', sans-serif;font-weight:600;font-size:15px;line-height:1.38;color:#1F1D1B;text-wrap:balance;\">L'agrume en clair-obscur, neige brûlée<\u002Fdiv>\n        <div data-cascade=\"1\" style=\"font-family:'Cormorant Garamond', Georgia, serif;font-style:italic;font-size:17px;line-height:1.35;color:#6B6660;max-width:300px;text-wrap:pretty;\">La rencontre entre l'acidité et la douceur, prolongée par un souffle glacé de verveine.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a data-cascade=\"1\" href=\"assets/Menu-Omar-Bennis.pdf\" download=\"Menu-degustation-Omar-Bennis.pdf\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:52px;display:flex;align-items:center;gap:10px;padding:13px 22px;border:1px solid #D9C9A6;border-radius:999px;font-family:'Cormorant Garamond', Georgia, serif;font-weight:600;font-size:12px;letter-spacing:.26em;color:#8A6A2F;text-decoration:none;background:rgba(255,255,255,.35);-webkit-tap-highlight-color:transparent;\" style-hover=\"border-color:#A8803A;color:#6E5424;\">\n      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"4\" x2=\"12\" y2=\"15\"><\u002Fline><polyline points=\"7,10.5 12,15.5 17,10.5\"><\u002Fpolyline><line x1=\"5\" y1=\"20\" x2=\"19\" y2=\"20\"><\u002Fline><\u002Fsvg>\n      <span style=\"padding-left:.26em;\">TÉLÉCHARGER LE MENU<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<button sc-camel-on-click=\"{{ toggleMute }}\" aria-label=\"{{ muteLabel }}\" style=\"position:fixed;z-index:30;top:max(12px, env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(60,45,25,.14);background:rgba(250,247,241,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#3A3733;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:.75;-webkit-tap-highlight-color:transparent;\" style-hover=\"opacity:1;\">\n  <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <polygon points=\"4,9 8,9 13,5 13,19 8,15 4,15\" fill=\"currentColor\" stroke=\"none\"><\u002Fpolygon>\n    <sc-if value=\"{{ muted }}\" hint-placeholder-val=\"{{ false }}\">\n      <line x1=\"16.5\" y1=\"9.5\" x2=\"21.5\" y2=\"14.5\"><\u002Fline>\n      <line x1=\"21.5\" y1=\"9.5\" x2=\"16.5\" y2=\"14.5\"><\u002Fline>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ unmuted }}\" hint-placeholder-val=\"{{ true }}\">\n      <path d=\"M16.5 9a4 4 0 0 1 0 6\"><\u002Fpath>\n      <path d=\"M19 6.5a7.5 7.5 0 0 1 0 11\"><\u002Fpath>\n    <\u002Fsc-if>\n  <\u002Fsvg>\n<\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ouvertDirect&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;label&quot;:&quot;Afficher le menu directement&quot;},&quot;vitesse&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Vitesse d'ouverture&quot;}}\">\nclass Component extends DCLogic {\n  state = { muted: false };\n  stageRef = React.createRef(); envRef = React.createRef(); backRef = React.createRef();\n  flapDropRef = React.createRef(); flapShadowRef = React.createRef(); flapRef = React.createRef();\n  flapShadeRef = React.createRef(); flapInShadeRef = React.createRef(); cardRef = React.createRef();\n  pocketRef = React.createRef(); sealRef = React.createRef(); breathRef = React.createRef();\n  menuRef = React.createRef(); sheetRef = React.createRef();\n  pieces = [\n    { clip: 'none', origin: '50% 50%', op: 1, whole: true },\n    { op: 0, clip: 'polygon(-40% -40%, 47% -40%, 46% 8%, 50% 18%, 47% 30%, 53% 40%, 52% 48%, 40% 55%, 30% 58%, 18% 64%, -40% 80%)', origin: '30% 30%', dx: -16, dy: 74, r: -28 },\n    { op: 0, clip: 'polygon(47% -40%, 140% -40%, 140% 88%, 88% 72%, 76% 70%, 68% 62%, 58% 56%, 52% 48%, 53% 40%, 47% 30%, 50% 18%, 46% 8%)', origin: '75% 38%', dx: 18, dy: 64, r: 34 },\n    { op: 0, clip: 'polygon(-40% 80%, 18% 64%, 30% 58%, 40% 55%, 52% 48%, 58% 56%, 68% 62%, 76% 70%, 88% 72%, 140% 88%, 140% 140%, -40% 140%)', origin: '50% 80%', dx: -3, dy: 96, r: 10 }\n  ];\n\n  componentDidMount() {\n    let muted = false;\n    try { muted = localStorage.getItem('ob-menu-muted') === '1'; } catch (e) {}\n    if (muted) this.setState({ muted });\n    if (this.props.ouvertDirect) { this.showDirect(); return; }\n    this.startIdle();\n    const env = this.envRef.current;\n    if (env) env.animate([{ opacity: 0, transform: 'translateY(16px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 1000, easing: 'cubic-bezier(.2,.7,.2,1)' });\n  }\n  componentDidUpdate(prev) {\n    if (prev.ouvertDirect !== this.props.ouvertDirect) {\n      this.reset();\n      if (this.props.ouvertDirect) this.showDirect(); else this.startIdle();\n    }\n  }\n  componentWillUnmount() { clearTimeout(this.tSound); }\n\n  reset() {\n    this.opened = false;\n    [this.stageRef.current, this.menuRef.current].forEach(el => el && el.getAnimations({ subtree: true }).forEach(a => a.cancel()));\n  }\n  showDirect() {\n    this.opened = true;\n    this.stageRef.current.animate([{ visibility: 'hidden' }, { visibility: 'hidden' }], { duration: 1, fill: 'forwards' });\n    this.menuRef.current.animate([{ visibility: 'visible' }, { visibility: 'visible' }], { duration: 1, fill: 'forwards' });\n  }\n  startIdle() {\n    this.idle = [];\n    const b = this.breathRef.current; if (!b) return;\n    this.idle.push(b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }], { duration: 1700, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' }));\n    this.stageRef.current.querySelectorAll('[data-shine]').forEach(el => this.idle.push(\n      el.animate([{ transform: 'translateX(-130%)' }, { transform: 'translateX(-130%)', offset: .55 }, { transform: 'translateX(130%)' }], { duration: 4200, iterations: Infinity, easing: 'ease-in-out' })\n    ));\n  }\n\n  ensureAudio() {\n    try {\n      if (!this.ac) {\n        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;\n        const ac = new AC(); this.ac = ac;\n        this.master = ac.createGain(); this.master.gain.value = this.state.muted ? 0 : 1; this.master.connect(ac.destination);\n        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);\n        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;\n        this.noise = buf;\n      }\n      if (this.ac.state === 'suspended') this.ac.resume();\n    } catch (e) {}\n  }\n  sndCrack(t) {\n    const ac = this.ac, out = this.master;\n    [0, 0.011, 0.028, 0.052, 0.085, 0.13, 0.19].forEach((dt, i) => {\n      const s = ac.createBufferSource(); s.buffer = this.noise;\n      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;\n      const pk = ac.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 2400 + Math.random() * 3200; pk.gain.value = 9; pk.Q.value = 2;\n      const g = ac.createGain(), st = t + dt, a = i === 0 ? 0.95 : i < 3 ? 0.55 : 0.12 + Math.random() * 0.22;\n      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(a, st + 0.0015);\n      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.018 + Math.random() * 0.035);\n      s.connect(hp); hp.connect(pk); pk.connect(g); g.connect(out);\n      s.start(st, Math.random() * 1.5); s.stop(st + 0.08);\n    });\n    const o = ac.createOscillator(); o.type = 'sine';\n    o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.09);\n    const og = ac.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.32, t + 0.004); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);\n    o.connect(og); og.connect(this.master); o.start(t); o.stop(t + 0.15);\n  }\n  sndNoise(t, dur, f0, f1, type, peak, q) {\n    const ac = this.ac;\n    const s = ac.createBufferSource(); s.buffer = this.noise; s.loop = true;\n    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;\n    f.frequency.setValueAtTime(f0, t); f.frequency.linearRampToValueAtTime(f1, t + dur);\n    const g = ac.createGain();\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.15);\n    g.gain.setValueAtTime(peak, t + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    const mod = ac.createGain(); mod.gain.value = 1;\n    const lfo = ac.createOscillator(); lfo.frequency.value = 13 + Math.random() * 8;\n    const lg = ac.createGain(); lg.gain.value = 0.35; lfo.connect(lg); lg.connect(mod.gain);\n    s.connect(f); f.connect(g); g.connect(mod); mod.connect(this.master);\n    s.start(t, Math.random()); s.stop(t + dur + 0.05); lfo.start(t); lfo.stop(t + dur + 0.05);\n  }\n\n  open = () => {\n    if (this.opened) return; this.opened = true;\n    const k = 1 / (this.props.vitesse ?? 1), T = ms => ms * k;\n    this.ensureAudio();\n    if (this.ac && this.noise) {\n      const now = this.ac.currentTime + 0.01;\n      this.sndCrack(now);\n      this.sndNoise(now + T(330) / 1000, T(520) / 1000, 900, 350, 'lowpass', 0.10, 0.6);\n      this.sndNoise(now + T(1120) / 1000, T(900) / 1000, 3400, 1500, 'bandpass', 0.24, 0.8);\n      this.sndNoise(now + T(2150) / 1000, T(500) / 1000, 2600, 1800, 'bandpass', 0.08, 0.7);\n    }\n    (this.idle || []).forEach(a => a.cancel());\n    const F = 'forwards';\n    const env = this.envRef.current, card = this.cardRef.current;\n    const er0 = env.getBoundingClientRect(), H = er0.height;\n\n    this.breathRef.current.animate([{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], { duration: T(170), fill: F });\n    const pcs = this.sealRef.current.querySelectorAll('[data-piece]');\n    pcs.forEach((el, i) => {\n      const p = this.pieces[i]; if (!p) return;\n      if (p.whole) { el.animate([{ opacity: 0 }, { opacity: 0 }], { delay: T(80), duration: 1, fill: F }); return; }\n      el.animate([\n        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },\n        { offset: .16, transform: `translate(${p.dx * .14}px, ${p.dy * .02}px) rotate(${p.r * .12}deg)`, opacity: 1 },\n        { offset: .72, opacity: 1 },\n        { transform: `translate(${p.dx}px, ${p.dy}px) rotate(${p.r}deg)`, opacity: 0 }\n      ], { duration: T(950), delay: T(80), easing: 'cubic-bezier(.45,0,.75,.6)', fill: 'both' });\n    });\n\n    env.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${H * 0.22}px)` }], { delay: T(300), duration: T(1600), easing: 'cubic-bezier(.45,0,.3,1)', fill: F });\n\n    const fo = { delay: T(320), duration: T(850), easing: 'cubic-bezier(.55,.05,.3,1)', fill: F };\n    this.flapShadowRef.current.animate([{ opacity: 1 }, { opacity: 0 }], { delay: T(300), duration: T(260), fill: F });\n    this.flapRef.current.animate([{ transform: 'perspective(1100px) rotateX(0deg)' }, { transform: 'perspective(1100px) rotateX(180deg)' }], fo);\n    this.flapShadeRef.current.animate([{ opacity: 0 }, { opacity: .9, offset: .5 }, { opacity: .9 }], fo);\n    this.flapInShadeRef.current.animate([{ opacity: .9 }, { opacity: .9, offset: .5 }, { opacity: 0 }], fo);\n    this.flapDropRef.current.animate([{ zIndex: 2 }, { zIndex: 2 }], { delay: T(320 + 850 * 0.5), duration: 1, fill: F });\n\n    const cardH = card.offsetHeight, slide = cardH * 0.62;\n    card.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-slide}px)` }], { delay: T(1120), duration: T(820), easing: 'cubic-bezier(.35,0,.2,1)', fill: F });\n\n    const drop = [{ transform: 'translateY(0)', opacity: 1 }, { transform: `translateY(${H * 0.95}px)`, opacity: 0 }];\n    const dopt = { delay: T(1800), duration: T(620), easing: 'cubic-bezier(.4,0,.9,.55)', fill: F };\n    [this.backRef, this.pocketRef, this.flapDropRef, this.sealRef].forEach(r => r.current.animate(drop, dopt));\n\n    this.tSound = setTimeout(() => {\n      const er = env.getBoundingClientRect(), sr = this.sheetRef.current.getBoundingClientRect();\n      const top = Math.max(sr.top, 0), bottom = Math.min(sr.bottom, window.innerHeight);\n      card.animate([{ zIndex: 10 }, { zIndex: 10 }], { duration: 1, fill: F });\n      card.animate([\n        { left: card.offsetLeft + 'px', top: card.offsetTop + 'px', width: card.offsetWidth + 'px', height: cardH + 'px', transform: `translateY(${-slide}px)` },\n        { left: (sr.left - er.left) + 'px', top: (top - er.top) + 'px', width: sr.width + 'px', height: (bottom - top) + 'px', transform: 'translateY(0)', boxShadow: '0 0 40px rgba(50,35,15,.18)' }\n      ], { duration: T(680), easing: 'cubic-bezier(.6,0,.25,1)', fill: F });\n    }, T(2200));\n\n    const menu = this.menuRef.current;\n    menu.scrollTop = 0;\n    menu.animate([{ visibility: 'visible', opacity: 0 }, { visibility: 'visible', opacity: 1 }], { delay: T(2840), duration: T(260), fill: F });\n    this.stageRef.current.animate([{ visibility: 'hidden' }, { visibility: 'hidden' }], { delay: T(3200), duration: 1, fill: F });\n    this.sheetRef.current.querySelectorAll('[data-cascade]').forEach((el, i) => {\n      el.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }], { delay: T(2880 + i * 115), duration: 620, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });\n    });\n  };\n\n  toggleMute = (e) => {\n    if (e) e.stopPropagation();\n    const muted = !this.state.muted;\n    this.setState({ muted });\n    try { localStorage.setItem('ob-menu-muted', muted ? '1' : '0'); } catch (err) {}\n    if (this.master && this.ac) this.master.gain.setTargetAtTime(muted ? 0 : 1, this.ac.currentTime, 0.02);\n  };\n\n  renderVals() {\n    return {\n      stageRef: this.stageRef, envRef: this.envRef, backRef: this.backRef, flapDropRef: this.flapDropRef,\n      flapShadowRef: this.flapShadowRef, flapRef: this.flapRef, flapShadeRef: this.flapShadeRef,\n      flapInShadeRef: this.flapInShadeRef, cardRef: this.cardRef, pocketRef: this.pocketRef,\n      sealRef: this.sealRef, breathRef: this.breathRef, menuRef: this.menuRef, sheetRef: this.sheetRef,\n      pieces: this.pieces, open: this.open, toggleMute: this.toggleMute,\n      muted: this.state.muted, unmuted: !this.state.muted,\n      muteLabel: this.state.muted ? 'Activer le son' : 'Couper le son'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
